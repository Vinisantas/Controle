version: '3.8'
services:
  app:
    build: .
    image: controle:latest
    ports:
      - "8503:8503"
    volumes:
      - ./Banco_Dados:/app/Banco_Dados
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD-SHELL","curl -f http://localhost:8503 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3